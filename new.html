<!-- Login page -->
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
         <i class="ri-bank-line"></i>
            <div>
             <h1>FinTrack Pro</h1>
             <p>Manage your money clearly.</p>
            </div>
        </div>

        <form class="login-form" id="loginForm">
         <h2>Welcome back</h2>
         <p>Log in to view your finance dashboard.</p>

         <label>Email</label>
         <input type="email" id="loginEmail" placeholder="you@example.com" required>

         <label>Password</label>
         <input type="password" id="loginPassword" placeholder="Enter your password" required>

         <button type="submit">Log In</button>

            <p class="login-switch">
              New to FinTrack?
             <button type="button" id="showSignup">Create an account</button>
            </p>
        </form>
    </div>
</div>

<!-- Sign-up page -->
<div class="signup-page">
  <div class="signup-card">
        <div class="signup-logo">
          <i class="ri-bank-line"></i>
 
            <div>
              <h1>FinTrack Pro</h1>
              <p>Create your personal finance account.</p>
            </div>
        </div>

        <form class="signup-form" id="signupForm">
         <h2>Create account</h2>
         <p>Start tracking your money today.</p>

         <label>Full Name</label>
         <input type="text" id="signupName" placeholder="Your name" required>

         <label>Email</label>
         <input type="email" id="signupEmail" placeholder="you@example.com" required>

         <label>Password</label>
         <input type="password" id="signupPassword" placeholder="Create a password" required>

         <button type="submit">Create Account</button>

            <p class="signup-switch">
             Already have an account?
             <button type="button" id="showLogin">Log in</button>
            </p>
        </form>
    </div>
</div>
